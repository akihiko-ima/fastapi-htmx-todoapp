<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart(Powered by FastAPI+htmx)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/dist/sse.js"></script>
  </head>
  <body
    class="min-h-screen bg-base-200 text-base-content"
    data-theme="light"
    hx-ext="sse"
    sse-connect="/chart/events"
  >
    <main
      class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-5 py-10 sm:py-16"
    >
      <section class="mb-8">
        <p
          class="mb-3 text-sm font-semibold uppercase tracking-[0.18em] text-primary"
        >
          Streaming Chart (Powered by FastAPI + htmx)
        </p>
        <div class="flex items-end justify-between gap-4">
          <h1 class="text-4xl font-black tracking-tight sm:text-5xl">Chart</h1>
          <a class="link link-hover text-sm" href="/">Todo へ戻る</a>
        </div>
      </section>

      <!-- サーバーが 1 秒ごとに描き直した SVG で差し替える -->
      <section
        class="overflow-hidden rounded-box border border-base-300 bg-base-100 pb-2 shadow-sm"
        sse-swap="chart-tick"
      >
        {{ chart | safe }}
      </section>
    </main>
  </body>
</html>
