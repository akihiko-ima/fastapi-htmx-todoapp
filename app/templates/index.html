<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo(Powered by FastAPI+htmx)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.1/response-targets.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.2/dist/cdn.min.js"
    ></script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .htmx-indicator {
        opacity: 0;
        transition: opacity 150ms ease-in;
      }
      .htmx-request.htmx-indicator,
      .htmx-request .htmx-indicator {
        opacity: 1;
      }
    </style>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content" data-theme="light">
    <main
      class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-5 py-10 sm:py-16"
      x-data="{ filter: 'all' }"
    >
      <section class="mb-8">
        <p
          class="mb-3 text-sm font-semibold uppercase tracking-[0.18em] text-primary"
        >
          Todo - App (Powered by FastAPI + htmx + Alpine.js)
        </p>
        <h1 class="text-4xl font-black tracking-tight sm:text-5xl">Todo</h1>
      </section>

      <form
        class="mb-2 flex flex-col gap-3 rounded-box border border-base-300 bg-base-100 p-3 shadow-sm sm:flex-row"
        hx-post="/todos"
        hx-target="#todo-list"
        hx-swap="outerHTML"
        hx-indicator="#add-indicator"
        hx-disabled-elt="find button[type='submit'], find input[name='title']"
        hx-target-4*="#form-error"
        hx-target-5*="#form-error"
        hx-on::after-request="if (event.detail.successful) { this.reset(); document.getElementById('form-error').innerHTML = ''; }"
      >
        <label class="sr-only" for="title">Todo</label>
        <input
          id="title"
          name="title"
          type="text"
          required
          placeholder="やることを入力"
          class="input min-h-11 flex-1 text-base"
        />
        <button class="btn btn-primary min-h-11 px-5" type="submit">
          <span
            id="add-indicator"
            class="htmx-indicator loading loading-spinner loading-sm"
          ></span>
          追加
        </button>
      </form>
      <div
        id="form-error"
        class="mb-6 text-sm text-error"
        role="alert"
        aria-live="polite"
      ></div>

      <nav
        class="mb-4 tabs tabs-box"
        role="tablist"
        aria-label="Todo の表示フィルター"
      >
        <button
          type="button"
          class="tab"
          :class="{ 'tab-active': filter === 'all' }"
          :aria-selected="filter === 'all'"
          @click="filter = 'all'"
        >
          すべて
        </button>
        <button
          type="button"
          class="tab"
          :class="{ 'tab-active': filter === 'active' }"
          :aria-selected="filter === 'active'"
          @click="filter = 'active'"
        >
          未完了
        </button>
        <button
          type="button"
          class="tab"
          :class="{ 'tab-active': filter === 'completed' }"
          :aria-selected="filter === 'completed'"
          @click="filter = 'completed'"
        >
          完了
        </button>
      </nav>

      {% include "_todo_list.html" %}
    </main>
  </body>
</html>
